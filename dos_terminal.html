<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRYONET Terminal SYSTEM</title>
    <style>
        :root {
            --outer-bg: #050505;
            --bg-color: #0c0c0c;
            --text-color: #E2A76F;
            --dim-color: #E2A76F;
            --error-color: #E2A76F;
            --border-color: #E2A76F;
            --glow-color: rgba(226, 167, 111, 0.4);
            --scanline-opacity: 0.25;
            --font-stack: 'Courier New', Courier, monospace;
            --font-size: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--outer-bg);
            color: var(--text-color);
            font-family: var(--font-stack);
            font-size: var(--font-size);
            line-height: 1.4;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 4px var(--glow-color);
        }

        /* 4:3 CRT Monitor Frame */
        #crt-frame {
            position: relative;
            aspect-ratio: 4 / 3;
            width: min(100vw, calc(100vh * (4 / 3)));
            height: min(100vh, calc(100vw * (3 / 4)));
            background-color: var(--bg-color);
            padding: 24px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 0, 0, 0.9);
        }

        /* Subtle CRT scanline overlay confined to the 4:3 screen */
        #crt-frame::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, var(--scanline-opacity)) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        #terminal {
            height: 100%;
            width: 100%;
            overflow-y: auto;
            scrollbar-width: none;
        }
        #terminal::-webkit-scrollbar {
            display: none;
        }

        /* Fullscreen container for running .EXE files, Media Player, and 3D Viewer */
        #app-viewport {
            display: none;
            height: 100%;
            width: 100%;
            overflow-y: auto;
            scrollbar-width: none;
        }
        #app-viewport::-webkit-scrollbar {
            display: none;
        }

        .output-line {
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 2px;
        }

        .output-line a {
            color: var(--text-color);
            text-decoration: underline;
            cursor: pointer;
        }

        .output-line a:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
            text-shadow: none;
        }

        .center-line {
            text-align: center;
            width: 100%;
        }

        .error-line {
            color: var(--error-color);
            text-shadow: 0 0 4px var(--glow-color);
        }

        .dim-line {
            color: var(--dim-color);
        }

        .input-line {
            display: flex;
            align-items: center;
        }

        .prompt-label {
            white-space: pre;
            margin-right: 4px;
        }

        #cmd-input {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-family: var(--font-stack);
            font-size: var(--font-size);
            flex: 1;
            outline: none;
            caret-color: var(--text-color);
            text-shadow: 0 0 4px var(--glow-color);
        }
    </style>

    <!-- Import Map for Three.js 3D Model Viewer -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="crt-frame">
        <div id="terminal" onclick="if(state !== 'APP' && window.getSelection().toString() === '') document.getElementById('cmd-input').focus()">
            <div id="output"></div>
            <div class="input-line" id="input-row" style="display: none;">
                <span class="prompt-label" id="prompt-label"></span>
                <input type="text" id="cmd-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            </div>
        </div>
        <!-- Dedicated screen surface for .EXE programs, Media Playback, and 3D Viewer -->
        <div id="app-viewport"></div>
    </div>

    <!-- External Configuration & Executable Files -->
    <script src="config.style.js" data-config-file="config.style.js"></script>
    <script src="config.startup.js" data-config-file="config.startup.js"></script>
    <script src="config.users.js" data-config-file="config.users.js"></script>
    <script src="config.filesystem.js" data-config-file="config.filesystem.js"></script>
    <script src="config.executables.js" data-config-file="config.executables.js"></script>

    <!-- Three.js Module Loader Bridge -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        window.THREE_VIEWER_DEPS = {
            THREE,
            OrbitControls,
            GLTFLoader,
            OBJLoader,
            STLLoader,
            FBXLoader,
            RoomEnvironment
        };
    </script>

    <script>
        // =========================================================================
        // BASE SETTINGS & EXTERNAL CONFIG MERGE
        // =========================================================================
        const DEFAULT_STYLE = {
            outerBg: "#050505",
            bgColor: "#0c0c0c",
            textColor: "#E2A76F",
            dimColor: "#E2A76F",
            errorColor: "#E2A76F",
            borderColor: "#E2A76F",
            glowColor: "rgba(226, 167, 111, 0.4)",
            scanlines: true,
            fontStack: "'Courier New', Courier, monospace",
            fontSize: "16px",
            pageTitle: "CRYONET Terminal SYSTEM"
        };

        const DEFAULT_STARTUP = {
            systemName: "CRYONET v3.2",
            bootDelay: 250,
            autoTypeSpeed: 65,
            autoRunCommands: [],
            bootLines: [
                "BIOS Date 01/15/94 14:22:51 Ver 1.02",
                "CPU: ATOM 86605XC 66MHz",
                "Memory Test: 16384K OK\n",
                "Initializing Keyboard... OK\n",
                "[PROGRESS][3]LOADING SYSTEM MODULES",
                "[CLEAR][CENTER]========================================",
                "[CENTER]CRYONET v3.2 - AUTHORIZED ACCESS ONLY",
                "[CENTER]========================================\n"
            ]
        };

        const CONFIG = {
            storageKey: "cryonet_saved_auth",
            users: {},
            fileSystem: {},
            executables: {},
            style: Object.assign({}, DEFAULT_STYLE),
            startup: Object.assign({}, DEFAULT_STARTUP)
        };

        function syncConfigFromWindow() {
            const incoming = window.CONFIG || {};
            if (incoming.storageKey) CONFIG.storageKey = incoming.storageKey;
            CONFIG.users = incoming.users || {};
            CONFIG.fileSystem = incoming.fileSystem || {};
            CONFIG.executables = incoming.executables || {};
            CONFIG.style = Object.assign({}, DEFAULT_STYLE, incoming.style);
            CONFIG.startup = Object.assign({}, DEFAULT_STARTUP, incoming.startup);
        }

        // =========================================================================
        // APPLY CONFIG.STYLE TO CSS VARIABLES
        // =========================================================================
        function applyConfigStyle() {
            const root = document.documentElement.style;
            const s = CONFIG.style;
            root.setProperty("--outer-bg", s.outerBg);
            root.setProperty("--bg-color", s.bgColor);
            root.setProperty("--text-color", s.textColor);
            root.setProperty("--dim-color", s.dimColor);
            root.setProperty("--error-color", s.errorColor);
            root.setProperty("--border-color", s.borderColor);
            root.setProperty("--glow-color", s.glowColor);
            root.setProperty("--scanline-opacity", s.scanlines ? "0.25" : "0");
            root.setProperty("--font-stack", s.fontStack);
            root.setProperty("--font-size", s.fontSize);
            if (s.pageTitle) document.title = s.pageTitle;
        }

        syncConfigFromWindow();
        applyConfigStyle();

        // =========================================================================
        // CLEARANCE LEVEL & OVERRIDE PASSWORD HELPERS (Levels 1 - 3)
        // =========================================================================
        let unlockedOverrides = new Set();
        let pendingOverride = null; // { key, password, label, onSuccess }

        function getUserLevel(username) {
            if (username === "GUEST") return 1;
            const rec = CONFIG.users[username];
            if (!rec || typeof rec.level !== "number") return 1;
            return Math.max(1, Math.min(3, Math.floor(rec.level)));
        }

        function hasClearance(requiredLevel, overrideKey = null) {
            const req = typeof requiredLevel === "number" ? requiredLevel : 1;
            if (currentUserLevel >= req) return true;
            if (overrideKey && unlockedOverrides.has(overrideKey)) return true;
            return false;
        }

        function isDirectoryEntry(entry) {
            return typeof entry === "object" && entry !== null && !("content" in entry);
        }

        function getEntryRequiredLevel(entry) {
            if (typeof entry === "object" && entry !== null) {
                if (typeof entry._level === "number") return entry._level;
                if (typeof entry.level === "number") return entry.level;
            }
            return 1;
        }

        function getEntryPassword(entry, exeDef = null) {
            if (typeof entry === "object" && entry !== null) {
                if (typeof entry._password === "string" && entry._password !== "") return entry._password;
                if (typeof entry.password === "string" && entry.password !== "") return entry.password;
            }
            if (typeof exeDef === "object" && exeDef !== null) {
                if (typeof exeDef.password === "string" && exeDef.password !== "") return exeDef.password;
            }
            return null;
        }

        function getFileTextContent(entry) {
            if (typeof entry === "string") return entry;
            if (typeof entry === "object" && entry !== null && typeof entry.content === "string") {
                return entry.content;
            }
            return "";
        }

        function promptOverridePassword(overrideKey, password, reqLevel, label, onSuccess) {
            pendingOverride = {
                key: overrideKey,
                password: password,
                label: label,
                onSuccess: onSuccess
            };
            state = "OVERRIDE_PASS";
            printLine(`CLEARANCE LEVEL ${reqLevel} REQUIRED FOR ${label} (Current: Level ${currentUserLevel})`, "dim-line");
            updatePrompt();
        }

        // =========================================================================
        // 3D MODEL FILE DETECTOR & INTERACTIVE THREE.JS VIEWER (FBX, GLB, OBJ, STL)
        // =========================================================================
        const MODEL_EXTENSIONS = [".FBX", ".GLB", ".GLTF", ".OBJ", ".STL"];

        function parse3DModelEntry(fileName, content, entryObj = null) {
            const upperName = fileName.toUpperCase();
            const trimmed = (content || "").trim();

            let format = null;
            for (const ext of MODEL_EXTENSIONS) {
                if (upperName.endsWith(ext)) {
                    format = ext.slice(1).toLowerCase();
                    break;
                }
            }

            const textureUrl = (entryObj && typeof entryObj === "object" && typeof entryObj.texture === "string")
                ? entryObj.texture.trim()
                : null;
            const resourcePath = (entryObj && typeof entryObj === "object" && typeof entryObj.resourcePath === "string")
                ? entryObj.resourcePath.trim()
                : null;

            if (!format && /^\[MODEL\]/i.test(trimmed)) {
                const target = trimmed.replace(/^\[MODEL\]/i, "").trim().replace(/\\/g, "/");
                const extMatch = target.match(/\.(fbx|glb|gltf|obj|stl)(?:[?#].*)?$/i);
                format = extMatch ? extMatch[1].toLowerCase() : "glb";
                return {
                    format,
                    source: target,
                    isInlineData: false,
                    textureUrl: textureUrl ? textureUrl.replace(/\\/g, "/") : null,
                    resourcePath: resourcePath ? resourcePath.replace(/\\/g, "/") : null
                };
            }

            if (!format) return null;

            const cleanSource = trimmed.replace(/^\[MODEL\]/i, "").trim().replace(/\\/g, "/");

            const isInlineObj = format === "obj" && /^(?:#|o\s|g\s|v\s|vn\s|vt\s|f\s|mtllib\s)/m.test(cleanSource) && !/\.(obj)$/i.test(cleanSource);
            const isInlineStl = format === "stl" && /^solid\s/i.test(cleanSource) && /endsolid/i.test(cleanSource);

            return {
                format,
                source: cleanSource,
                isInlineData: isInlineObj || isInlineStl,
                textureUrl: textureUrl ? textureUrl.replace(/\\/g, "/") : null,
                resourcePath: resourcePath ? resourcePath.replace(/\\/g, "/") : null
            };
        }

        function launchModelViewer(modelInfo, fileName) {
            const deps = window.THREE_VIEWER_DEPS;
            if (!deps) {
                printLine("3D SUBSYSTEM ERROR: Three.js module still initializing or blocked by network/CSP.", "error-line");
                return;
            }

            const { THREE, OrbitControls, GLTFLoader, OBJLoader, STLLoader, FBXLoader, RoomEnvironment } = deps;
            state = "APP";
            clearScreen();
            terminalEl.style.display = "none";
            appViewport.innerHTML = "";
            appViewport.style.display = "block";

            const accent = CONFIG.style.textColor;
            const bg = CONFIG.style.bgColor;

            let wireframeMode = !(
                modelInfo.textureUrl ||
                modelInfo.format === "fbx" ||
                modelInfo.format === "glb" ||
                modelInfo.format === "gltf"
            );
            let showRigCurves = false;

            appViewport.innerHTML = `
                <div style="border: 1px solid ${accent}; padding: 10px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; gap: 8px;">
                    <div style="background: ${accent}; color: ${bg}; padding: 4px 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
                        <span>CRYONET 3D CAD VIEWER // ${fileName}</span>
                        <span>FORMAT: ${modelInfo.format.toUpperCase()}</span>
                    </div>

                    <div id="model-canvas-wrap" style="flex: 1; border: 1px solid ${accent}; background: ${bg}; position: relative; overflow: hidden;">
                        <div id="model-status" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; z-index: 2; max-width: 90%; word-break: break-word;">
                            LOADING MESH & TEXTURES...
                        </div>
                    </div>

                    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px;">
                        <span id="model-stats">VERTS: 0 | TRIS: 0</span>
                        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                            <button id="btn-wireframe" style="background: transparent; color: ${accent}; border: 1px solid ${accent}; padding: 3px 8px; font-family: inherit; cursor: pointer;">
                                [ WIREFRAME: ${wireframeMode ? "ON" : "OFF"} ]
                            </button>
                            <button id="btn-rigs" style="background: transparent; color: ${accent}; border: 1px solid ${accent}; padding: 3px 8px; font-family: inherit; cursor: pointer;">
                                [ RIGS: OFF ]
                            </button>
                            <button id="btn-spin" style="background: transparent; color: ${accent}; border: 1px solid ${accent}; padding: 3px 8px; font-family: inherit; cursor: pointer;">
                                [ SPIN: ON ]
                            </button>
                            <button id="btn-grid" style="background: transparent; color: ${accent}; border: 1px solid ${accent}; padding: 3px 8px; font-family: inherit; cursor: pointer;">
                                [ GRID: ON ]
                            </button>
                            <button id="btn-reset-cam" style="background: transparent; color: ${accent}; border: 1px solid ${accent}; padding: 3px 8px; font-family: inherit; cursor: pointer;">
                                [ RESET ]
                            </button>
                            <button id="btn-close-model" style="background: ${accent}; color: ${bg}; border: none; padding: 3px 10px; font-family: inherit; font-weight: bold; cursor: pointer;">
                                [ EXIT ]
                            </button>
                        </div>
                    </div>
                </div>
            `;

            const canvasWrap = appViewport.querySelector("#model-canvas-wrap");
            const statusEl = appViewport.querySelector("#model-status");
            const statsEl = appViewport.querySelector("#model-stats");

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(bg);

            const width = canvasWrap.clientWidth || 640;
            const height = canvasWrap.clientHeight || 400;

            const camera = new THREE.PerspectiveCamera(45, width / height, 0.01, 1000);
            camera.position.set(2.5, 1.8, 2.5);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;
            canvasWrap.appendChild(renderer.domElement);

            // Studio IBL environment so PBR/metallic FBX surfaces reflect light instead of pitch black
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            const envTexture = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
            scene.environment = envTexture;
            scene.environmentIntensity = 0.85;

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.07;

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
            hemiLight.position.set(0, 10, 0);
            scene.add(hemiLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
            keyLight.position.set(5, 8, 6);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0xffffff, 0.9);
            fillLight.position.set(-5, 3, -5);
            scene.add(fillLight);

            const gridHelper = new THREE.GridHelper(6, 16, new THREE.Color(accent), new THREE.Color(accent));
            gridHelper.material.opacity = 0.25;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            let loadedRoot = null;
            let autoSpin = true;
            let showGrid = true;
            let animFrameId = null;
            let disposed = false;
            let overrideTexture = null;

            const wireMaterial = new THREE.MeshBasicMaterial({
                color: new THREE.Color(accent),
                wireframe: true
            });

            const solidFallbackMaterial = new THREE.MeshStandardMaterial({
                color: new THREE.Color(accent),
                roughness: 0.5,
                metalness: 0.2
            });

            if (modelInfo.textureUrl) {
                const texLoader = new THREE.TextureLoader();
                texLoader.setCrossOrigin("anonymous");
                overrideTexture = texLoader.load(modelInfo.textureUrl, (tex) => {
                    tex.colorSpace = THREE.SRGBColorSpace;
                    tex.flipY = !(modelInfo.format === "glb" || modelInfo.format === "gltf");
                    tex.needsUpdate = true;
                });
            }

            function prepareMeshMaterials(object3D) {
                object3D.traverse((child) => {
                    // Hide Maya/Blender NURBS rig controller curves (blue circles/splines) by default
                    if (child.isLine) {
                        child.visible = showRigCurves;
                        return;
                    }

                    if (!child.isMesh) return;

                    // Strip all-zero vertex color attributes that turn FBX textures pitch black
                    if (child.geometry && child.geometry.attributes.color) {
                        const colAttr = child.geometry.attributes.color;
                        let allZero = true;
                        for (let i = 0; i < Math.min(colAttr.count * colAttr.itemSize, 300); i++) {
                            if (colAttr.array[i] > 0.01) {
                                allZero = false;
                                break;
                            }
                        }
                        if (allZero) {
                            child.geometry.deleteAttribute("color");
                        }
                    }

                    if (overrideTexture) {
                        child.userData.origMaterial = new THREE.MeshStandardMaterial({
                            map: overrideTexture,
                            color: 0xffffff,
                            roughness: 0.55,
                            metalness: 0.1,
                            side: THREE.DoubleSide
                        });
                    } else if (child.material) {
                        const mats = Array.isArray(child.material) ? child.material : [child.material];
                        mats.forEach((m) => {
                            if (m.map) {
                                m.map.colorSpace = THREE.SRGBColorSpace;
                                m.map.needsUpdate = true;
                                if (m.color) m.color.setHex(0xffffff);
                            }
                            if (m.emissiveMap) {
                                m.emissiveMap.colorSpace = THREE.SRGBColorSpace;
                                m.emissiveMap.needsUpdate = true;
                            }
                            // Clamp Maya/FBX Phong specular reflectivity so white painted surfaces don't turn into dark mirror chrome
                            if (typeof m.metalness === "number" && m.metalness > 0.35) {
                                m.metalness = 0.25;
                            }
                            if (typeof m.roughness === "number" && m.roughness < 0.35) {
                                m.roughness = 0.4;
                            }
                            m.vertexColors = Boolean(child.geometry && child.geometry.attributes.color);
                            m.side = THREE.DoubleSide;
                            m.needsUpdate = true;
                        });
                        child.userData.origMaterial = child.material;
                    } else {
                        child.userData.origMaterial = solidFallbackMaterial;
                    }
                });
            }

            function applyMaterialMode() {
                if (!loadedRoot) return;
                loadedRoot.traverse((child) => {
                    if (child.isMesh) {
                        child.material = wireframeMode ? wireMaterial : child.userData.origMaterial;
                    }
                });
            }

            function frameLoadedObject(object3D) {
                loadedRoot = object3D;
                prepareMeshMaterials(loadedRoot);

                // Compute bounding box from actual meshes only (ignoring wide rig control curves)
                const box = new THREE.Box3();
                loadedRoot.updateMatrixWorld(true);
                loadedRoot.traverse((child) => {
                    if (child.isMesh) {
                        box.expandByObject(child);
                    }
                });
                if (box.isEmpty()) {
                    box.setFromObject(loadedRoot);
                }

                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z) || 1;
                const scale = 2.2 / maxDim;

                loadedRoot.scale.multiplyScalar(scale);
                loadedRoot.position.set(
                    -center.x * scale,
                    -box.min.y * scale,
                    -center.z * scale
                );

                let vertCount = 0;
                let triCount = 0;
                let texCount = 0;
                loadedRoot.traverse((child) => {
                    if (child.isMesh && child.geometry) {
                        const pos = child.geometry.attributes.position;
                        if (pos) vertCount += pos.count;
                        if (child.geometry.index) {
                            triCount += Math.floor(child.geometry.index.count / 3);
                        } else if (pos) {
                            triCount += Math.floor(pos.count / 3);
                        }
                        const mats = Array.isArray(child.userData.origMaterial)
                            ? child.userData.origMaterial
                            : [child.userData.origMaterial];
                        mats.forEach((m) => { if (m && m.map) texCount++; });
                    }
                });

                statsEl.textContent = `VERTS: ${vertCount.toLocaleString()} | TRIS: ${triCount.toLocaleString()}${texCount > 0 ? ` | TEX: ${texCount}` : ""}`;
                applyMaterialMode();
                scene.add(loadedRoot);
                statusEl.style.display = "none";

                camera.position.set(0, (size.y * scale) * 0.55, 2.8);
                controls.target.set(0, (size.y * scale) * 0.5, 0);
                controls.update();
            }

            function handleLoadError(err) {
                if (disposed) return;
                console.error("3D Loader Error:", err);
                const isLocalFileProtocol = window.location.protocol === "file:";
                const detail = err && err.message ? err.message : "Network / 404 / CORS error";
                const resolvedUrl = modelInfo.source ? new URL(modelInfo.source, window.location.href).href : "(empty path)";

                statusEl.innerHTML = [
                    `<div>ERROR LOADING 3D ASSET</div>`,
                    `<div style="margin-top:6px; font-size:13px;">PATH: ${resolvedUrl}</div>`,
                    `<div style="margin-top:4px; font-size:13px;">REASON: ${detail}</div>`,
                    isLocalFileProtocol
                        ? `<div style="margin-top:8px; font-size:12px;">NOTE: Browsers block loading .FBX/.GLB files from file:// URLs. Serve via Live Server or GitHub Pages.</div>`
                        : ""
                ].join("");
            }

            if (!modelInfo.source && !modelInfo.isInlineData) {
                handleLoadError(new Error("No file path specified in config.filesystem.js"));
            } else {
                try {
                    if (modelInfo.format === "fbx") {
                        const loader = new FBXLoader();
                        loader.setCrossOrigin("anonymous");
                        if (modelInfo.resourcePath) {
                            loader.setResourcePath(modelInfo.resourcePath);
                        }
                        loader.load(
                            modelInfo.source,
                            (fbxGroup) => { if (!disposed) frameLoadedObject(fbxGroup); },
                            undefined,
                            handleLoadError
                        );
                    } else if (modelInfo.format === "glb" || modelInfo.format === "gltf") {
                        const loader = new GLTFLoader();
                        loader.setCrossOrigin("anonymous");
                        if (modelInfo.resourcePath) {
                            loader.setResourcePath(modelInfo.resourcePath);
                        }
                        loader.load(
                            modelInfo.source,
                            (gltf) => { if (!disposed) frameLoadedObject(gltf.scene); },
                            undefined,
                            handleLoadError
                        );
                    } else if (modelInfo.format === "obj") {
                        const loader = new OBJLoader();
                        if (modelInfo.isInlineData) {
                            const obj = loader.parse(modelInfo.source);
                            frameLoadedObject(obj);
                        } else {
                            loader.load(
                                modelInfo.source,
                                (obj) => { if (!disposed) frameLoadedObject(obj); },
                                undefined,
                                handleLoadError
                            );
                        }
                    } else if (modelInfo.format === "stl") {
                        const loader = new STLLoader();
                        if (modelInfo.isInlineData) {
                            const geo = loader.parse(modelInfo.source);
                            geo.computeVertexNormals();
                            const mesh = new THREE.Mesh(geo, solidFallbackMaterial);
                            mesh.rotation.x = -Math.PI / 2;
                            frameLoadedObject(mesh);
                        } else {
                            loader.load(
                                modelInfo.source,
                                (geo) => {
                                    if (disposed) return;
                                    geo.computeVertexNormals();
                                    const mesh = new THREE.Mesh(geo, solidFallbackMaterial);
                                    mesh.rotation.x = -Math.PI / 2;
                                    frameLoadedObject(mesh);
                                },
                                undefined,
                                handleLoadError
                            );
                        }
                    }
                } catch (e) {
                    handleLoadError(e);
                }
            }

            // Toolbar Controls

            const btnRigs = appViewport.querySelector("#btn-rigs");

            btnReset.onclick = () => {

            const onResize = () => {
                if (disposed) return;

        // =========================================================================
        // [LINK] FILE & INLINE LINK PARSERS
        // =========================================================================
        function normalizeUrl(rawTarget) {
            return /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(rawTarget)
                ? rawTarget
                : `https://${rawTarget}`;
        }

        function parseStandaloneLinkFile(text) {
            if (typeof text !== "string") return null;
            const trimmed = text.trim();
            const match = trimmed.match(/^\[LINK\](\S+)$/i);
            if (!match) return null;

            const rawTarget = match[1].replace(/[.,;:!?)]+$/, "");
            if (!rawTarget) return null;

            return { rawTarget, url: normalizeUrl(rawTarget) };
        }

        function openExternalLink(linkInfo, fileName) {
            const div = document.createElement("div");
            div.className = "output-line";
            div.appendChild(document.createTextNode(`Opening external link (${fileName}) -> `));

            const anchor = document.createElement("a");
            anchor.href = linkInfo.url;
            anchor.target = "_blank";
            anchor.rel = "noopener noreferrer";
            anchor.textContent = linkInfo.url;

            div.appendChild(anchor);
            outputEl.appendChild(div);
            terminalEl.scrollTop = terminalEl.scrollHeight;

            window.open(linkInfo.url, "_blank", "noopener,noreferrer");
        }

        function printRichText(text, className = "") {
            if (text === "" || text === null || text === undefined) return;
            const div = document.createElement("div");
            div.className = `output-line ${className}`.trim();

            const linkRegex = /\[LINK\]([^\s<>"']+)/gi;
            let lastIndex = 0;
            let match;

            while ((match = linkRegex.exec(text)) !== null) {
                if (match.index > lastIndex) {
                    div.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
                }

                const fullToken = match[1];
                const cleanTarget = fullToken.replace(/[.,;:!?)]+$/, "");
                const trailingPunct = fullToken.slice(cleanTarget.length);

                if (cleanTarget) {
                    const anchor = document.createElement("a");
                    anchor.href = normalizeUrl(cleanTarget);
                    anchor.target = "_blank";
                    anchor.rel = "noopener noreferrer";
                    anchor.textContent = cleanTarget;
                    div.appendChild(anchor);
                } else {
                    div.appendChild(document.createTextNode(match[0]));
                }

                if (trailingPunct) {
                    div.appendChild(document.createTextNode(trailingPunct));
                }

                lastIndex = linkRegex.lastIndex;
            }

            if (lastIndex < text.length) {
                div.appendChild(document.createTextNode(text.slice(lastIndex)));
            }

            outputEl.appendChild(div);
            terminalEl.scrollTop = terminalEl.scrollHeight;
            return div;
        }

        // =========================================================================
        // SAVED SESSION HELPERS (Safe localStorage + cookie fallback)
        // =========================================================================
        function saveLoginCredentials(username, password) {
            const payload = JSON.stringify({ u: username, p: password });
            try {
                localStorage.setItem(CONFIG.storageKey, payload);
            } catch (e) {
                document.cookie = `${CONFIG.storageKey}=${encodeURIComponent(payload)}; path=/; max-age=2592000; SameSite=Lax`;
            }
        }

        function getSavedCredentials() {
            let raw = null;
            try {
                raw = localStorage.getItem(CONFIG.storageKey);
            } catch (e) {
                const match = document.cookie.match(new RegExp(`(?:^|; )${CONFIG.storageKey}=([^;]*)`));
                if (match) raw = decodeURIComponent(match[1]);
            }

            if (!raw) return null;
            try {
                const data = JSON.parse(raw);
                const userRecord = CONFIG.users[data.u];
                if (userRecord && userRecord.password === data.p) {
                    return { username: data.u, password: data.p, record: userRecord };
                }
            } catch (e) {
                clearSavedCredentials();
            }
            return null;
        }

        function clearSavedCredentials() {
            try {
                localStorage.removeItem(CONFIG.storageKey);
            } catch (e) {}
            document.cookie = `${CONFIG.storageKey}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax`;
        }

        // =========================================================================
        // DYNAMIC FULL-CONFIG RELOADER
        // =========================================================================
        const CONFIG_FILES = [
            "config.style.js",
            "config.startup.js",
            "config.users.js",
            "config.filesystem.js",
            "config.executables.js"
        ];

        function loadSingleConfigScript(fileName) {
            return new Promise((resolve) => {
                const oldScript = document.querySelector(`script[data-config-file="${fileName}"]`);
                if (oldScript) oldScript.remove();

                const script = document.createElement("script");
                script.setAttribute("data-config-file", fileName);
                script.src = `${fileName}?v=${Date.now()}`;

                script.onload = () => resolve({ fileName, ok: true });
                script.onerror = () => resolve({ fileName, ok: false });

                document.body.appendChild(script);
            });
        }

        async function reloadAllConfigs() {
            inputRow.style.display = "none";
            printLine("Reloading system configuration modules...", "dim-line");

            window.CONFIG = {};

            for (const fileName of CONFIG_FILES) {
                const res = await loadSingleConfigScript(fileName);
                if (res.ok) {
                    printLine(`  [OK]   ${fileName}`, "dim-line");
                } else {
                    printLine(`  [WARN] ${fileName} (not found or skipped)`, "dim-line");
                }
            }

            syncConfigFromWindow();
            applyConfigStyle();

            if (currentUser && currentUser !== "GUEST" && !CONFIG.users[currentUser]) {
                clearSavedCredentials();
                printLine(`\nUser "${currentUser}" no longer exists in config.users.js. Logging out...\n`, "error-line");
                startLogin();
                return;
            }

            if (currentUser) {
                currentUserLevel = getUserLevel(currentUser);
            }

            let checkObj = CONFIG.fileSystem;
            let validPath = [];
            for (const folder of currentPath) {
                const nextObj = checkObj ? checkObj[folder] : null;
                const folderKey = `DIR:${[...validPath, folder].join("\\")}`;
                if (isDirectoryEntry(nextObj) && hasClearance(getEntryRequiredLevel(nextObj), folderKey)) {
                    validPath.push(folder);
                    checkObj = nextObj;
                } else {
                    printLine(`Access revoked or directory ${folder} missing. Resetting to C:\\`, "dim-line");
                    break;
                }
            }
            currentPath = validPath;

            printLine(`All configurations reloaded. Active Clearance: LEVEL ${currentUserLevel}.\n`);
            updatePrompt();
        }

        // =========================================================================
        // YOUTUBE LINK & PLAYLIST DETECTOR + EMBEDDED MEDIA PLAYER
        // =========================================================================
        function parseYouTubeMedia(text) {
            if (typeof text !== "string") return null;

            const trimmed = text.trim();
            if (!/(?:youtube\.com|youtu\.be)/i.test(trimmed)) return null;

            const videoMatch = trimmed.match(
                /(?:https?:\/\/)?(?:www\.|m\.)?(?:youtube\.com\/(?:watch\?(?:[^#\s]*&)?v=|embed\/|v\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/
            );
            const listMatch = trimmed.match(/[?&]list=([a-zA-Z0-9_-]+)/);

            const videoId = videoMatch ? videoMatch[1] : null;
            const listId = listMatch ? listMatch[1] : null;

            if (!videoId && !listId) return null;

            if (!videoId && listId) {
                return {
                    embedUrl: `https://www.youtube.com/embed/videoseries?list=${listId}&autoplay=1&rel=0`,
                    label: `PLAYLIST // ${listId}`
                };
            }

            if (videoId && listId) {
                return {
                    embedUrl: `https://www.youtube.com/embed/${videoId}?list=${listId}&autoplay=1&rel=0`,
                    label: `STREAM // ${videoId} [LIST: ${listId}]`
                };
            }

            return {
                embedUrl: `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`,
                label: `STREAM ID: ${videoId}`
            };
        }

        // =========================================================================
        // UNIFIED FILE OPENER (Direct filename or TYPE command)
        // =========================================================================
        function executeOpenedFile(fileName, entry, args = []) {
            if (fileName.endsWith(".EXE")) {
                launchExecutable(fileName, args, getEntryRequiredLevel(entry), true);
                return;
            }

            const content = getFileTextContent(entry);

            // 1. 3D Model File (.FBX, .GLB, .GLTF, .OBJ, .STL or [MODEL] tag)
            const modelInfo = parse3DModelEntry(fileName, content, entry);
            if (modelInfo) {
                launchModelViewer(modelInfo, fileName);
                return;
            }

            // 2. Standalone [LINK] file -> open immediately in new tab
            const linkInfo = parseStandaloneLinkFile(content);
            if (linkInfo) {
                openExternalLink(linkInfo, fileName);
                return;
            }

            // 3. YouTube video/playlist -> open embedded CRT media player
            const mediaInfo = parseYouTubeMedia(content);
            if (mediaInfo) {
                launchVideoPlayer(mediaInfo, fileName, content);
                return;
            }

            // 4. Text file (supports inline [LINK]url tags as clickable links)
            printRichText(content);
        }

        function openFileEntry(fileName, args = []) {
            const dirObj = getCurrentDirObject();
            const entry = dirObj[fileName];
            const exeDef = fileName.endsWith(".EXE") ? CONFIG.executables[fileName] : null;

            let reqLevel = getEntryRequiredLevel(entry);
            if (typeof exeDef === "object" && exeDef !== null && typeof exeDef.level === "number") {
                reqLevel = Math.max(reqLevel, exeDef.level);
            }

            const fileKey = `FILE:${[...currentPath, fileName].join("\\")}`;
            const overridePass = getEntryPassword(entry, exeDef);

            if (!hasClearance(reqLevel, fileKey)) {
                if (overridePass) {
                    promptOverridePassword(fileKey, overridePass, reqLevel, fileName, () => {
                        executeOpenedFile(fileName, entry, args);
                    });
                } else {
                    printLine(`ACCESS DENIED: ${fileName} requires Clearance Level ${reqLevel} (Current: Level ${currentUserLevel}).`, "error-line");
                }
                return;
            }

            executeOpenedFile(fileName, entry, args);
        }

        // =========================================================================
        // CUSTOM COMMANDS (with minLevel: 1 | 2 | 3 support)
        // =========================================================================
        const COMMANDS = {
            HELP: {
                minLevel: 1,
                description: "Displays commands available at your clearance level.",
                execute: (args, ctx) => {
                    let lines = [
                        `Available commands (Clearance Level ${ctx.userLevel}):`,
                        "  <FILENAME> - Opens a text file, 3D model, link, video, or executable."
                    ];
                    for (const [cmd, info] of Object.entries(COMMANDS)) {
                        if (hasClearance(info.minLevel)) {
                            lines.push(`  ${cmd.padEnd(10)} - ${info.description}`);
                        }
                    }
                    return lines.join("\n");
                }
            },
            DIR: {
                minLevel: 1,
                description: "Displays files and subdirectories in a directory.",
                execute: (args, ctx) => {
                    const dirObj = ctx.getCurrentDirObject();
                    const entries = Object.entries(dirObj).filter(([key]) => !key.startsWith("_"));
                    let out = [` Directory of ${ctx.getPathString()}\n`];
                    
                    if (ctx.currentPath.length > 0) {
                        out.push("  .            <DIR>");
                        out.push("  ..           <DIR>");
                    }

                    let fileCount = 0;
                    let dirCount = 0;

                    for (const [name, entry] of entries) {
                        const reqLevel = getEntryRequiredLevel(entry);
                        const isDir = isDirectoryEntry(entry);
                        const itemKey = `${isDir ? "DIR" : "FILE"}:${[...ctx.currentPath, name].join("\\")}`;
                        const unlocked = hasClearance(reqLevel, itemKey);
                        const hasPass = Boolean(getEntryPassword(entry, !isDir && name.endsWith(".EXE") ? CONFIG.executables[name] : null));

                        let lockTag = "";
                        if (reqLevel > 1) {
                            if (unlocked) {
                                lockTag = ` [LVL ${reqLevel}]`;
                            } else {
                                lockTag = hasPass ? ` [LVL ${reqLevel} - PASSWORD]` : ` [LVL ${reqLevel} - LOCKED]`;
                            }
                        }

                        if (isDir) {
                            out.push(`  ${name.padEnd(12)} <DIR>${lockTag}`);
                            dirCount++;
                        } else {
                            const content = getFileTextContent(entry);
                            const isStandaloneLink = Boolean(parseStandaloneLinkFile(content));
                            const is3DModel = Boolean(parse3DModelEntry(name, content, entry));

                            let meta = `${String(content.length).padStart(8, " ")} bytes`;
                            if (isStandaloneLink) meta = "   <LINK>";
                            else if (is3DModel) meta = "   <3D>";

                            out.push(`  ${name.padEnd(12)} ${meta}${lockTag}`);
                            fileCount++;
                        }
                    }

                    out.push(`\n        ${fileCount} file(s)`);
                    out.push(`        ${dirCount} dir(s)`);
                    return out.join("\n");
                }
            },
            CD: {
                minLevel: 1,
                description: "Displays the name of or changes the current directory.",
                execute: (args, ctx) => {
                    if (!args[0]) return ctx.getPathString();
                    const target = args[0].toUpperCase();

                    if (target === "\\" || target === "/") {
                        ctx.currentPath = [];
                        return "";
                    }
                    if (target === "..") {
                        if (ctx.currentPath.length > 0) ctx.currentPath.pop();
                        return "";
                    }
                    if (target === ".") return "";

                    const dirObj = ctx.getCurrentDirObject();
                    const entry = dirObj[target];

                    if (isDirectoryEntry(entry)) {
                        const reqLevel = getEntryRequiredLevel(entry);
                        const dirKey = `DIR:${[...ctx.currentPath, target].join("\\")}`;

                        if (!hasClearance(reqLevel, dirKey)) {
                            const overridePass = getEntryPassword(entry);
                            if (overridePass) {
                                promptOverridePassword(dirKey, overridePass, reqLevel, target, () => {
                                    currentPath.push(target);
                                });
                                return { asyncHandled: true };
                            }
                            return { error: `ACCESS DENIED: ${target} requires Clearance Level ${reqLevel} (Current: Level ${ctx.userLevel}).` };
                        }
                        ctx.currentPath.push(target);
                        return "";
                    }
                    return { error: `Invalid directory: ${args[0]}` };
                }
            },
            TYPE: {
                minLevel: 1,
                description: "Displays a text file, 3D model, link, or video.",
                execute: (args, ctx) => {
                    if (!args[0]) return { error: "Required parameter missing" };
                    const fileName = args[0].toUpperCase();
                    if (fileName.startsWith("_")) return { error: `File not found - ${args[0]}` };

                    const dirObj = ctx.getCurrentDirObject();
                    if (!(fileName in dirObj)) {
                        return { error: `File not found - ${args[0]}` };
                    }

                    const entry = dirObj[fileName];
                    if (isDirectoryEntry(entry)) {
                        return { error: `Access denied - ${args[0]} is a directory` };
                    }

                    if (fileName.endsWith(".EXE")) {
                        return { error: `Cannot display binary executable - Run ${fileName} directly.` };
                    }

                    openFileEntry(fileName, args.slice(1));
                    return "";
                }
            },
            RELOAD: {
                minLevel: 3,
                description: "[LVL 3] Reloads all external configuration files.",
                execute: () => {
                    reloadAllConfigs();
                    return { asyncHandled: true };
                }
            },
            ECHO: {
                minLevel: 1,
                description: "Displays messages.",
                execute: (args) => args.join(" ")
            },
            VER: {
                minLevel: 1,
                description: "Displays the OS version.",
                execute: () => `\n${CONFIG.startup.systemName}\n`
            },
            WHOAMI: {
                minLevel: 1,
                description: "Displays the current user and clearance level.",
                execute: (args, ctx) => `Current user: ${ctx.currentUser} [CLEARANCE LEVEL ${ctx.userLevel}]`
            },
            CLS: {
                minLevel: 1,
                description: "Clears the screen.",
                execute: (args, ctx) => {
                    ctx.clearScreen();
                    return "";
                }
            },
            LOGOUT: {
                minLevel: 1,
                description: "Clears saved login and logs out.",
                execute: (args, ctx) => {
                    ctx.logout();
                    return "";
                }
            }
        };

        // =========================================================================
        // CORE TERMINAL ENGINE & EXECUTABLE LOADER

        let state = "BOOT"; // BOOT | AUTO_LOGIN | LOGIN_USER | LOGIN_PASS | OVERRIDE_PASS | SHELL | APP
        let pendingUser = "";
        let currentUser = null;
        let currentUserLevel = 1;

        function printLine(text, className = "") {

        function getCurrentDirObject() {

        }

        function launchExecutable(exeName, args, fileReqLevel = 1, bypassClearanceCheck = false) {
            const exeDef = CONFIG.executables[exeName];
            let handler = null;
            let exeMinLevel = fileReqLevel;

            if (typeof exeDef === "function") {
                handler = exeDef;
            } else if (typeof exeDef === "object" && exeDef !== null && typeof exeDef.run === "function") {
                handler = exeDef.run;
                if (typeof exeDef.level === "number") {
                    exeMinLevel = Math.max(exeMinLevel, exeDef.level);
                }
            }

            if (!bypassClearanceCheck && !hasClearance(exeMinLevel)) {
                printLine(`ACCESS DENIED: ${exeName} requires Clearance Level ${exeMinLevel} (Current: Level ${currentUserLevel}).`, "error-line");
                return;
            }

            if (typeof handler !== "function") {
                printLine(`PROGRAM ERROR: Missing binary handler for ${exeName} in config.executables.js`, "error-line");
                return;
            }

            state = "APP";
            clearScreen();
            terminalEl.style.display = "none";
            appViewport.innerHTML = "";
            appViewport.style.display = "block";

            const appContext = {
                container: appViewport,
                args: args,
                user: currentUser,
                userLevel: currentUserLevel,
                path: getPathString(),
                fileSystem: CONFIG.fileSystem,
                style: CONFIG.style,
                exit: (exitMessage = "") => {
                    appViewport.innerHTML = "";
                    appViewport.style.display = "none";
                    terminalEl.style.display = "block";
                    state = "SHELL";
                    if (exitMessage) printLine(exitMessage);
                    updatePrompt();
                }
            };

            handler(appContext);
        }

        function updatePrompt() {
            if (state === "LOGIN_USER") {
                promptLabel.textContent = "LOGIN: ";
                cmdInput.type = "text";
                cmdInput.readOnly = false;
            } else if (state === "LOGIN_PASS") {
                promptLabel.textContent = "PASSWORD: ";
                cmdInput.type = "password";
                cmdInput.readOnly = false;
            } else if (state === "OVERRIDE_PASS") {
                promptLabel.textContent = "OVERRIDE PASSWORD: ";
                cmdInput.type = "password";
                cmdInput.readOnly = false;
            } else if (state === "SHELL") {
                promptLabel.textContent = `${getPathString()}>`;
                cmdInput.type = "text";
                cmdInput.readOnly = false;
            }
            inputRow.style.display = "flex";
            cmdInput.value = "";
            cmdInput.focus();
            terminalEl.scrollTop = terminalEl.scrollHeight;
        }

        function onSessionAuthenticated(userKey, userRecord) {
            currentUser = userKey;
            currentUserLevel = getUserLevel(userKey);
            unlockedOverrides.clear();
            pendingOverride = null;
            pendingUser = "";
            state = "SHELL";
            printLine(`\n[CLEARANCE LEVEL ${currentUserLevel} VERIFIED]`);
            printLine(`${userRecord.welcomeMessage || "Access granted."}\n`);
            updatePrompt();

            if (Array.isArray(CONFIG.startup.autoRunCommands)) {
                for (const cmd of CONFIG.startup.autoRunCommands) {
                    if (state === "SHELL" && typeof cmd === "string" && cmd.trim()) {
                        handleInput(cmd);
                    }
                }
            }
        }

        function startLogin() {
            state = "LOGIN_USER";
            pendingUser = "";
            pendingOverride = null;
            unlockedOverrides.clear();
            currentUser = null;
            currentUserLevel = 1;
            currentPath = [];
            updatePrompt();
        }

        function runAutoLogin(saved) {
            state = "AUTO_LOGIN";
            cmdInput.readOnly = true;
            cmdInput.type = "text";
            cmdInput.value = "";
            promptLabel.textContent = "LOGIN: ";
            inputRow.style.display = "flex";
            cmdInput.focus();

            function typeText(text, onComplete) {
                let idx = 0;
                function step() {
                    if (idx < text.length) {
                        cmdInput.value += text[idx];
                        idx++;
                        setTimeout(step, CONFIG.startup.autoTypeSpeed);
                    } else {
                        setTimeout(onComplete, 180);
                    }
                }
                setTimeout(step, 200);
            }

            typeText(saved.username, () => {
                printLine(`LOGIN: ${saved.username}`);
                pendingUser = saved.username;
                cmdInput.value = "";
                cmdInput.type = "password";
                promptLabel.textContent = "PASSWORD: ";

                typeText(saved.password, () => {
                    printLine(`PASSWORD: ${"*".repeat(saved.password.length)}`);
                    onSessionAuthenticated(saved.username, saved.record);
                });
            });
        }

        function runBootProgressBar(durationSeconds, label, classString, onComplete) {
            const totalMs = Math.max(0.1, Number(durationSeconds) || 1) * 1000;
            const barWidth = 24;
            const startTime = performance.now();
            const prefix = label ? `${label} ` : "";

            const renderBar = (pct) => {
                const filled = Math.round((pct / 100) * barWidth);
                const empty = barWidth - filled;
                const bar = "█".repeat(filled) + "░".repeat(empty);
                const pctText = String(pct).padStart(3, " ") + "%";
                return `${prefix}[${bar}] ${pctText}`;
            };

            const lineEl = printLine(renderBar(0), classString);

            function tick(now) {
                const elapsed = now - startTime;
                const pct = Math.min(100, Math.floor((elapsed / totalMs) * 100));
                lineEl.textContent = renderBar(pct);
                terminalEl.scrollTop = terminalEl.scrollHeight;

                if (elapsed < totalMs) {
                    requestAnimationFrame(tick);
                } else {
                    lineEl.textContent = renderBar(100);
                    setTimeout(onComplete, CONFIG.startup.bootDelay);
                }
            }

            requestAnimationFrame(tick);
        }

        function bootSequence() {
            inputRow.style.display = "none";
            clearScreen();
            const bootLines = CONFIG.startup.bootLines || [];

            let i = 0;
            function nextBootLine() {
                if (i < bootLines.length) {
                    const entry = bootLines[i];
                    let text = "";
                    let classes = ["dim-line"];
                    let shouldClear = false;
                    let progressSeconds = null;

                    if (typeof entry === "object" && entry !== null) {
                        text = entry.text || "";
                        shouldClear = Boolean(entry.clear);
                        if (typeof entry.progress === "number") progressSeconds = entry.progress;
                        if (entry.align === "center") classes.push("center-line");
                        if (entry.className) classes.push(entry.className);
                    } else if (typeof entry === "string") {
                        text = entry;
                        let tagFound = true;
                        while (tagFound) {
                            tagFound = false;
                            if (text.startsWith("[CLEAR]")) {
                                shouldClear = true;
                                text = text.slice(7);
                                tagFound = true;
                            }
                            if (text.startsWith("[CENTER]")) {
                                classes.push("center-line");
                                text = text.slice(8);
                                tagFound = true;
                            }
                            const progMatch = text.match(/^\[PROGRESS\]\[(\d+(?:\.\d+)?)\]/);
                            if (progMatch) {
                                progressSeconds = parseFloat(progMatch[1]);
                                text = text.slice(progMatch[0].length);
                                tagFound = true;
                            }
                        }
                    }

                    if (shouldClear) {
                        clearScreen();
                    }

                    i++;

                    if (progressSeconds !== null) {
                        runBootProgressBar(progressSeconds, text.trim(), classes.join(" "), nextBootLine);
                    } else {
                        printLine(text, classes.join(" "));
                        setTimeout(nextBootLine, CONFIG.startup.bootDelay);
                    }
                } else {
                    const saved = getSavedCredentials();
                    if (saved) {
                        runAutoLogin(saved);
                    } else {
                        startLogin();
                    }
                }
            }
            nextBootLine();
        }

        function handleInput(rawValue) {
            if (state === "AUTO_LOGIN" || state === "BOOT") return;

            if (state === "LOGIN_USER") {
                const userKey = rawValue.trim().toUpperCase();
                if (!userKey) {
                    printLine("LOGIN: GUEST");
                    const guestRecord = Object.assign(
                        { welcomeMessage: "Logged in as GUEST (Limited Access). Type HELP for commands." },
                        CONFIG.users.GUEST || {},
                        { level: 1 }
                    );
                    onSessionAuthenticated("GUEST", guestRecord);
                    return;
                }
                printLine(`LOGIN: ${rawValue}`);
                pendingUser = userKey;
                state = "LOGIN_PASS";
                updatePrompt();
                return;
            }

            if (state === "LOGIN_PASS") {
                printLine(`PASSWORD: ${"*".repeat(rawValue.length)}`);
                const userRecord = CONFIG.users[pendingUser];
                if (userRecord && userRecord.password === rawValue) {
                    saveLoginCredentials(pendingUser, rawValue);
                    onSessionAuthenticated(pendingUser, userRecord);
                } else {
                    printLine("ACCESS DENIED: Invalid username or password.\n", "error-line");
                    state = "LOGIN_USER";
                    pendingUser = "";
                    updatePrompt();
                }
                return;
            }

            if (state === "OVERRIDE_PASS") {
                printLine(`OVERRIDE PASSWORD: ${"*".repeat(rawValue.length)}`);
                const currentOverride = pendingOverride;
                pendingOverride = null;
                state = "SHELL";

                if (currentOverride && rawValue === currentOverride.password) {
                    unlockedOverrides.add(currentOverride.key);
                    printLine(`OVERRIDE ACCEPTED: ${currentOverride.label} unlocked.\n`, "dim-line");
                    currentOverride.onSuccess();
                } else {
                    printLine("ACCESS DENIED: Invalid override password.\n", "error-line");
                }

                if (state === "SHELL") {
                    updatePrompt();
                }
                return;
            }

            if (state === "SHELL") {
                printLine(`${getPathString()}>${rawValue}`);
                const trimmed = rawValue.trim();
                if (!trimmed) {
                    updatePrompt();
                    return;
                }

                commandHistory.push(trimmed);
                historyIndex = commandHistory.length;

                const parts = trimmed.split(/\s+/);
                const cmdName = parts[0].toUpperCase();
                const args = parts.slice(1);

                if (COMMANDS[cmdName]) {
                    const cmdDef = COMMANDS[cmdName];
                    if (!hasClearance(cmdDef.minLevel)) {
                        printLine(`ACCESS DENIED: ${cmdName} requires Clearance Level ${cmdDef.minLevel} (Current: Level ${currentUserLevel}).`, "error-line");
                        updatePrompt();
                        return;
                    }

                    const context = {
                        currentUser,
                        userLevel: currentUserLevel,
                        currentPath,
                        getPathString,
                        getCurrentDirObject,
                        clearScreen,
                        logout: () => {
                            clearSavedCredentials();
                            clearScreen();
                            printLine("Saved credentials cleared. Logged out.\n", "dim-line");
                            startLogin();
                        }
                    };
                    const result = cmdDef.execute(args, context);
                    if (result && typeof result === "object" && result.asyncHandled) {
                        return;
                    }
                    if (result && typeof result === "object" && result.error) {
                        printLine(result.error, "error-line");
                    } else if (result) {
                        printLine(result);
                    }
                } else if (!cmdName.startsWith("_")) {
                    const dirObj = getCurrentDirObject();

                    // 1. Exact file match in current directory (.TXT, .EXE, .VID, .LNK, .FBX, .GLB, .GLTF, .OBJ, .STL)
                    if (cmdName in dirObj && !isDirectoryEntry(dirObj[cmdName])) {
                        openFileEntry(cmdName, args);
                        if (state === "SHELL") updatePrompt();
                        return;
                    }

                    // 2. Shorthand matches without extension
                    for (const ext of [".EXE", ".VID", ".LNK", ".FBX", ".GLB", ".GLTF", ".OBJ", ".STL"]) {
                        const candidate = `${cmdName}${ext}`;
                        if (candidate in dirObj && !isDirectoryEntry(dirObj[candidate])) {
                            openFileEntry(candidate, args);
                            if (state === "SHELL") updatePrompt();
                            return;
                        }
                    }

                    printLine("Bad command or file name", "error-line");
                } else {
                    printLine("Bad command or file name", "error-line");
                }

                if (state === "SHELL") {
                    updatePrompt();
                }
            }
        }

        cmdInput.addEventListener("keydown", (e) => {
            if (state === "AUTO_LOGIN" || state === "BOOT") {
                e.preventDefault();
                return;
            }

            if (e.key === "Enter") {
                handleInput(cmdInput.value);
            } else if (state === "SHELL" && e.key === "ArrowUp") {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    cmdInput.value = commandHistory[historyIndex];
                }
            } else if (state === "SHELL" && e.key === "ArrowDown") {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    cmdInput.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    cmdInput.value = "";
                }
            }
        });

        window.onload = bootSequence;
    </script>
</body>
